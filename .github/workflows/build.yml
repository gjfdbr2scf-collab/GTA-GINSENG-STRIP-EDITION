name: Build Nintendo DS ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build .nds
        working-directory: Ginseng_Strip_GTA
        run: make

      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: ginseng-strip-gta-nds
          path: Ginseng_Strip_GTA/ginseng_strip_gta.nds
          if-no-files-found: error
